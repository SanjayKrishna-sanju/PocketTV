
name: Pocket TV Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sanju/pockettv
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PocketTV"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.sanju.pockettv"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sanju.pockettv"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2025.02.00"))
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="Pocket TV"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sanju/pockettv/MainActivity.kt <<'EOF'
          package com.sanju.pockettv

          import android.content.Intent
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          data class TvApp(
              val name: String,
              val packageName: String,
              val activityName: String
          )

          class MainActivity : ComponentActivity() {

              private fun findTvApps(): List<TvApp> {
                  val intent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)
                  }

                  return packageManager
                      .queryIntentActivities(intent, 0)
                      .mapNotNull { result ->
                          val info = result.activityInfo ?: return@mapNotNull null
                          TvApp(
                              name = result.loadLabel(packageManager).toString(),
                              packageName = info.packageName,
                              activityName = info.name
                          )
                      }
                      .distinctBy { it.packageName }
                      .sortedBy { it.name.lowercase() }
              }

              private fun openTvApp(app: TvApp) {
                  try {
                      val intent = Intent().apply {
                          setClassName(app.packageName, app.activityName)
                      }
                      startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = (
                      android.view.View.SYSTEM_UI_FLAG_FULLSCREEN
                      or android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      or android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      or android.view.View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  )

                  setContent {
                      var apps by remember { mutableStateOf(emptyList<TvApp>()) }

                      fun refreshApps() {
                          apps = findTvApps()
                      }

                      LaunchedEffect(Unit) {
                          refreshApps()
                      }

                      PocketTvScreen(
                          apps = apps,
                          onRefresh = { refreshApps() },
                          onLaunch = { openTvApp(it) }
                      )
                  }
              }
          }

          @Composable
          fun PocketTvScreen(
              apps: List<TvApp>,
              onRefresh: () -> Unit,
              onLaunch: (TvApp) -> Unit
          ) {
              val background = Color(0xFF0B1020)
              val cardColor = Color(0xFF1C2942)
              val accent = Color(0xFF65B5FF)

              MaterialTheme {
                  Column(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(background)
                          .padding(horizontal = 32.dp, vertical = 22.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.SpaceBetween,
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column {
                              Text(
                                  "POCKET TV",
                                  color = accent,
                                  fontSize = 15.sp,
                                  fontWeight = FontWeight.Bold
                              )
                              Text(
                                  "Your entertainment hub",
                                  color = Color.White,
                                  fontSize = 28.sp,
                                  fontWeight = FontWeight.Bold
                              )
                          }

                          Button(onClick = onRefresh) {
                              Text("Refresh apps")
                          }
                      }

                      Spacer(modifier = Modifier.height(24.dp))

                      Text(
                          "YOUR TV APPS",
                          color = Color.LightGray,
                          fontSize = 14.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(modifier = Modifier.height(14.dp))

                      if (apps.isEmpty()) {
                          Box(
                              modifier = Modifier.fillMaxSize(),
                              contentAlignment = Alignment.Center
                          ) {
                              Text(
                                  "No Android TV-compatible apps found.\n" +
                                      "Install compatible apps and tap Refresh.",
                                  color = Color.White,
                                  fontSize = 18.sp
                              )
                          }
                      } else {
                          LazyVerticalGrid(
                              columns = GridCells.Adaptive(minSize = 180.dp),
                              horizontalArrangement = Arrangement.spacedBy(16.dp),
                              verticalArrangement = Arrangement.spacedBy(16.dp),
                              modifier = Modifier.fillMaxSize()
                          ) {
                              items(apps) { app ->
                                  Card(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .height(115.dp)
                                          .clickable { onLaunch(app) },
                                      colors = CardDefaults.cardColors(
                                          containerColor = cardColor
                                      )
                                  ) {
                                      Box(
                                          modifier = Modifier
                                              .fillMaxSize()
                                              .padding(16.dp),
                                          contentAlignment = Alignment.Center
                                      ) {
                                          Text(
                                              app.name,
                                              color = Color.White,
                                              fontSize = 19.sp,
                                              fontWeight = FontWeight.SemiBold
                                          )
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Pocket TV APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketTV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
