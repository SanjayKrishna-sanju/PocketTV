name: Pocket TV Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create Pocket TV Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sanju/pockettv

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PocketTV"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.9.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.sanju.pockettv"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.sanju.pockettv"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2025.02.00"))
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Pocket TV"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true"
                      android:screenOrientation="landscape">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/sanju/pockettv/MainActivity.kt <<'EOF'
          package com.sanju.pockettv

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.focusable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.BasicTextField
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Text
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.focus.onFocusChanged
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.graphics.drawable.toBitmap

          data class PocketApp(
              val name: String,
              val packageName: String,
              val activityName: String,
              val isTv: Boolean
          )

          class MainActivity : ComponentActivity() {

              private fun loadApps(): List<PocketApp> {
                  val pm = packageManager

                  val tvIntent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_LEANBACK_LAUNCHER)
                  }
                  val phoneIntent = Intent(Intent.ACTION_MAIN).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }

                  val tvApps = pm.queryIntentActivities(tvIntent, 0).mapNotNull { result ->
                      val activity = result.activityInfo ?: return@mapNotNull null
                      PocketApp(
                          name = result.loadLabel(pm).toString(),
                          packageName = activity.packageName,
                          activityName = activity.name,
                          isTv = true
                      )
                  }

                  val phoneApps = pm.queryIntentActivities(phoneIntent, 0).mapNotNull { result ->
                      val activity = result.activityInfo ?: return@mapNotNull null
                      PocketApp(
                          name = result.loadLabel(pm).toString(),
                          packageName = activity.packageName,
                          activityName = activity.name,
                          isTv = false
                      )
                  }

                  // Prefer the TV activity when an app exposes both TV and phone launchers.
                  return (tvApps + phoneApps)
                      .distinctBy { it.packageName }
                      .sortedBy { it.name.lowercase() }
              }

              private fun launchApp(app: PocketApp) {
                  runCatching {
                      val intent = Intent().setClassName(app.packageName, app.activityName)
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(intent)
                  }
              }

              private fun installApk(uri: Uri) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O &&
                      !packageManager.canRequestPackageInstalls()
                  ) {
                      // Android requires the user to allow installs from Pocket TV in Settings.
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                              Uri.parse("package:$packageName")
                          )
                      )
                      return
                  }

                  val installIntent = Intent(Intent.ACTION_INSTALL_PACKAGE).apply {
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                  }
                  runCatching { startActivity(installIntent) }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  @Suppress("DEPRECATION")
                  window.decorView.systemUiVisibility = (
                      android.view.View.SYSTEM_UI_FLAG_FULLSCREEN or
                      android.view.View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                      android.view.View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                      android.view.View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  )

                  setContent {
                      var apps by remember { mutableStateOf(loadApps()) }

                      val apkPicker = rememberLauncherForActivityResult(
                          contract = ActivityResultContracts.OpenDocument()
                      ) { uri ->
                          if (uri != null) installApk(uri)
                      }

                      PocketTvHome(
                          apps = apps,
                          onRefresh = { apps = loadApps() },
                          onLaunch = { launchApp(it) },
                          onInstallApk = {
                              apkPicker.launch(
                                  arrayOf(
                                      "application/vnd.android.package-archive",
                                      "application/octet-stream"
                                  )
                              )
                          },
                          onExit = { finish() },
                          iconFor = { packageName ->
                              runCatching {
                                  packageManager.getApplicationIcon(packageName).toBitmap(96, 96).asImageBitmap()
                              }.getOrNull()
                          }
                      )
                  }
              }
          }

          @Composable
          private fun AppTile(
              app: PocketApp,
              icon: androidx.compose.ui.graphics.ImageBitmap?,
              onClick: () -> Unit
          ) {
              var focused by remember { mutableStateOf(false) }

              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .height(132.dp)
                      .background(Color(0xFF17263D), RoundedCornerShape(18.dp))
                      .border(
                          width = if (focused) 3.dp else 1.dp,
                          color = if (focused) Color(0xFF68C8FF) else Color(0xFF30445F),
                          shape = RoundedCornerShape(18.dp)
                      )
                      .onFocusChanged { focused = it.isFocused }
                      .focusable()
                      .clickable { onClick() }
                      .padding(12.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.Center
              ) {
                  if (icon != null) {
                      Image(
                          bitmap = icon,
                          contentDescription = app.name,
                          modifier = Modifier.size(48.dp)
                      )
                  } else {
                      Box(
                          Modifier.size(48.dp).background(Color(0xFF29415F), RoundedCornerShape(12.dp)),
                          contentAlignment = Alignment.Center
                      ) {
                          Text(app.name.take(1).uppercase(), color = Color.White, fontSize = 24.sp)
                      }
                  }
                  Spacer(Modifier.height(9.dp))
                  Text(
                      text = app.name,
                      color = Color.White,
                      fontSize = 15.sp,
                      fontWeight = FontWeight.SemiBold,
                      maxLines = 1
                  )
                  Text(
                      text = if (app.isTv) "TV compatible" else "Phone app",
                      color = if (app.isTv) Color(0xFF80D6B0) else Color(0xFFB6C3D5),
                      fontSize = 11.sp
                  )
              }
          }

          @Composable
          private fun SidebarItem(
              label: String,
              selected: Boolean,
              onClick: () -> Unit
          ) {
              var focused by remember { mutableStateOf(false) }

              Box(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(
                          color = when {
                              selected -> Color(0xFF29496D)
                              focused -> Color(0xFF213650)
                              else -> Color.Transparent
                          },
                          shape = RoundedCornerShape(12.dp)
                      )
                      .border(
                          width = if (focused) 2.dp else 0.dp,
                          color = if (focused) Color(0xFF68C8FF) else Color.Transparent,
                          shape = RoundedCornerShape(12.dp)
                      )
                      .onFocusChanged { focused = it.isFocused }
                      .focusable()
                      .clickable { onClick() }
                      .padding(horizontal = 13.dp, vertical = 13.dp)
              ) {
                  Text(label, color = Color.White, fontSize = 15.sp, fontWeight = FontWeight.Medium)
              }
          }

          @Composable
          private fun PocketTvHome(
              apps: List<PocketApp>,
              onRefresh: () -> Unit,
              onLaunch: (PocketApp) -> Unit,
              onInstallApk: () -> Unit,
              onExit: () -> Unit,
              iconFor: (String) -> androidx.compose.ui.graphics.ImageBitmap?
          ) {
              var section by remember { mutableStateOf("Home") }
              var search by remember { mutableStateOf("") }

              val filteredApps = apps.filter { app ->
                  val matchesSearch = search.isBlank() || app.name.contains(search, ignoreCase = true)
                  val matchesSection = when (section) {
                      "TV Apps" -> app.isTv
                      "Phone Apps" -> !app.isTv
                      else -> true
                  }
                  matchesSearch && matchesSection
              }

              val accent = Color(0xFF68C8FF)
              val background = Color(0xFF080E1A)

              MaterialTheme {
                  Row(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(background)
                          .padding(20.dp)
                  ) {
                      Column(
                          modifier = Modifier
                              .width(190.dp)
                              .fillMaxHeight()
                              .background(Color(0xFF101C2E), RoundedCornerShape(18.dp))
                              .padding(13.dp),
                          verticalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          Text(
                              "POCKET TV",
                              color = accent,
                              fontSize = 21.sp,
                              fontWeight = FontWeight.Black
                          )
                          Text("TV mode for Android", color = Color(0xFF9EADC2), fontSize = 11.sp)
                          Spacer(Modifier.height(12.dp))

                          listOf("Home", "TV Apps", "Phone Apps", "All Apps").forEach { item ->
                              SidebarItem(
                                  label = item,
                                  selected = section == item,
                                  onClick = { section = item }
                              )
                          }

                          Spacer(Modifier.weight(1f))
                          SidebarItem("Install APK", false, onInstallApk)
                          SidebarItem("Refresh apps", false, onRefresh)
                          SidebarItem("Exit TV Mode", false, onExit)
                      }

                      Spacer(Modifier.width(22.dp))

                      Column(
                          modifier = Modifier
                              .weight(1f)
                              .fillMaxHeight()
                      ) {
                          Text(
                              text = when (section) {
                                  "TV Apps" -> "Your TV apps"
                                  "Phone Apps" -> "Your phone apps"
                                  "All Apps" -> "All installed apps"
                                  else -> "Your entertainment hub"
                              },
                              color = Color.White,
                              fontSize = 28.sp,
                              fontWeight = FontWeight.Bold
                          )
                          Spacer(Modifier.height(5.dp))
                          Text(
                              "${filteredApps.size} apps available",
                              color = Color(0xFF9EADC2),
                              fontSize = 13.sp
                          )
                          Spacer(Modifier.height(14.dp))

                          BasicTextField(
                              value = search,
                              onValueChange = { search = it },
                              singleLine = true,
                              textStyle = TextStyle(color = Color.White, fontSize = 16.sp),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(Color(0xFF15243A), RoundedCornerShape(12.dp))
                                  .padding(horizontal = 15.dp, vertical = 13.dp),
                              decorationBox = { innerTextField ->
                                  Box {
                                      if (search.isEmpty()) {
                                          Text("Search installed apps...", color = Color(0xFF91A2B8))
                                      }
                                      innerTextField()
                                  }
                              }
                          )

                          Spacer(Modifier.height(16.dp))

                          if (filteredApps.isEmpty()) {
                              Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                                  Text(
                                      if (apps.isEmpty()) {
                                          "No launchable apps found."
                                      } else {
                                          "No apps match your search."
                                      },
                                      color = Color.LightGray,
                                      fontSize = 18.sp
                                  )
                              }
                          } else {
                              LazyVerticalGrid(
                                  columns = GridCells.Adaptive(minSize = 145.dp),
                                  horizontalArrangement = Arrangement.spacedBy(13.dp),
                                  verticalArrangement = Arrangement.spacedBy(13.dp),
                                  contentPadding = PaddingValues(bottom = 16.dp)
                              ) {
                                  items(filteredApps, key = { it.packageName }) { app ->
                                      AppTile(
                                          app = app,
                                          icon = iconFor(app.packageName),
                                          onClick = { onLaunch(app) }
                                      )
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Pocket TV APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketTV-final-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
